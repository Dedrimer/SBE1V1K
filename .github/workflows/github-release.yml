name: Build and publish SBE1V1K firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.3.0"
        required: true
        type: string
      jobs:
        description: "Parallel make jobs"
        required: false
        type: number
        default: 4
      clean:
        description: "Run make dirclean before configuring"
        required: false
        type: boolean
        default: true
      retry_serial:
        description: "Retry a failed parallel build with -j1 V=s"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OUTPUT_DIR: ${{ github.workspace }}/out/targets/qualcommbe/ipq95xx
      RELEASE_DIR: ${{ github.workspace }}/release
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show host information
        run: |
          set -euxo pipefail
          uname -a
          printf 'Architecture: '; uname -m
          printf 'CPU cores: '; nproc
          printf 'Compiler: '; gcc --version | head -n 1
          printf 'Disk:\n'; df -h

      - name: Validate release tag
        run: |
          set -euxo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            printf 'Release tag must look like v1.2.3 or v1.2.3-preview1: %s\n' "$RELEASE_TAG" >&2
            exit 1
          }

      - name: Build from a clean OpenWrt tree
        env:
          BUILD_JOBS: ${{ inputs.jobs || 4 }}
          BUILD_CLEAN: ${{ inputs.clean }}
          BUILD_RETRY_SERIAL: ${{ inputs.retry_serial }}
        run: |
          set -euxo pipefail
          args=(--jobs "$BUILD_JOBS")
          if [[ "$BUILD_CLEAN" != false ]]; then
            args+=(--clean)
          fi
          if [[ "$BUILD_RETRY_SERIAL" == false ]]; then
            args+=(--no-retry)
          fi
          bash ./build-sbe1v1k.sh "${args[@]}"

      - name: Collect release assets
        run: |
          set -Eeuo pipefail
          mkdir -p "$RELEASE_DIR"

          mapfile -t images < <(find "$OUTPUT_DIR" -maxdepth 1 -type f \
            \( -name '*askey_sbe1v1k*.bin' -o -name '*askey_sbe1v1k*.itb' \) | sort)
          ((${#images[@]} >= 3)) || {
            printf 'Expected at least three SBE1V1K images in %s\n' "$OUTPUT_DIR" >&2
            exit 1
          }
          printf 'Firmware images:\n'
          printf '  %s\n' "${images[@]}"
          cp -v "${images[@]}" "$RELEASE_DIR/"

          for metadata in config.buildinfo feeds.buildinfo version.buildinfo; do
            metadata_path="$(find "$OUTPUT_DIR" -maxdepth 1 -type f -name "$metadata" -print -quit)"
            [[ -n "$metadata_path" ]] || {
              printf 'Missing required release metadata: %s\n' "$metadata" >&2
              exit 1
            }
            cp -v "$metadata_path" "$RELEASE_DIR/"
          done

          mapfile -t manifests < <(find "$OUTPUT_DIR" -maxdepth 1 -type f \
            -name '*askey_sbe1v1k*.manifest' | sort)
          ((${#manifests[@]} > 0)) || {
            printf 'Missing SBE1V1K manifest in %s\n' "$OUTPUT_DIR" >&2
            exit 1
          }
          cp -v "${manifests[@]}" "$RELEASE_DIR/"
          cp -v out/build-time.txt "$RELEASE_DIR/"

          (cd "$RELEASE_DIR" && sha256sum \
            *.bin *.itb *.manifest *.buildinfo build-time.txt > sha256sums)
          printf '\nRelease files:\n'
          find "$RELEASE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: SBE1V1K OpenWrt ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: release/*

      - name: Upload build logs on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbe1v1k-build-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: |
            .build-logs/
            out/
